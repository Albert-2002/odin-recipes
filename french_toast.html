  <h1>French Toast</h1>
  <p>
    <em>French Toast</em>, is a fairly simple recipe. You just need bread,
    eggs, milk, cinnamon and a sweetner!
  </p>
  <p><strong>Recipe:</strong></p>
  <ol>
    <li>Gather all the ingredients</li>
    <li>Beat eggs, milk, sugar and cinnamon into a smooth mixture</li>
    <li>Soak bread in the mixture and toast lightly on both sides</li>
    <li>Serve hot!</li>
  </ol>
